services:
  # Golang API Backend
  api:
    # build:
    #   context: ./api
    #   dockerfile: Dockerfile
    image: blog_api:latest
    container_name: blog_api
    environment:
      - DB_HOST=
      - DB_PORT=
      - DB_NAME=blog
      - DB_USER=
      - DB_PASSWORD=
      - DB_SSLMODE=disable
      - PORT=80
      - GIN_MODE=release
    networks:
      - reverse-proxy-networks
    restart: unless-stopped
    expose:
      - 80
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Frontend
  client:
    # build:
    #   context: ./client
    #   dockerfile: Dockerfile
    #   args:
    #     - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://apiblog.lehuuhieu.dev/api}
    image: blog_client:latest
    container_name: blog_client
    networks:
      - reverse-proxy-networks
    restart: unless-stopped
    expose: 
      - 3000
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  reverse-proxy-networks:
    external: true