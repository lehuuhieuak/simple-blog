version: '3.8'

services:
  # Microsoft SQL Server Database
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: blog_mssql_staging
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD_FILE=/run/secrets/db_password
      - MSSQL_PID=Express
    secrets:
      - db_password
    volumes:
      - mssql_staging_data:/var/opt/mssql
      - ./backups:/var/backups
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P $(cat /run/secrets/db_password) -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # Golang API Backend
  api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME_API:-blog-app/api}:${TAG:-latest}
    container_name: blog_api_staging
    environment:
      - DB_HOST=mssql
      - DB_PORT=1433
      - DB_NAME=${DB_NAME:-blog_staging}
      - DB_USER=sa
      - DB_ENCRYPT=true
      - DB_TRUST_CERT=false
      - PORT=8080
      - GIN_MODE=release
    env_file:
      - ./secrets/.env.staging
    secrets:
      - db_password
      - jwt_secret
    depends_on:
      mssql:
        condition: service_healthy
    networks:
      - backend_network
      - frontend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Frontend
  client:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME_CLIENT:-blog-app/client}:${TAG:-latest}
    container_name: blog_client_staging
    networks:
      - frontend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: blog_nginx_staging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_staging_logs:/var/log/nginx
    depends_on:
      - client
      - api
    networks:
      - frontend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: blog_redis_staging
    command: redis-server --requirepass $(cat /run/secrets/redis_password)
    secrets:
      - redis_password
    volumes:
      - redis_staging_data:/data
    networks:
      - backend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$(cat /run/secrets/redis_password)", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mssql_staging_data:
    driver: local
  redis_staging_data:
    driver: local
  nginx_staging_logs:
    driver: local

networks:
  frontend_network:
    driver: bridge
    internal: false
  backend_network:
    driver: bridge
    internal: true

secrets:
  db_password:
    file: ./secrets/staging_db_password.txt
  jwt_secret:
    file: ./secrets/staging_jwt_secret.txt
  redis_password:
    file: ./secrets/staging_redis_password.txt