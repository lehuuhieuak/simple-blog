name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
        else
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        fi
    
    - name: Generate changelog
      run: |
        # Get the previous tag
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        if [ -n "$PREVIOUS_TAG" ]; then
          echo "## Changes since $PREVIOUS_TAG" > CHANGELOG.md
          git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD >> CHANGELOG.md
        else
          echo "## Initial Release" > CHANGELOG.md
          git log --pretty=format:"- %s (%h)" >> CHANGELOG.md
        fi
        
        echo "" >> CHANGELOG.md
        echo "## Docker Images" >> CHANGELOG.md
        echo "- API: \`ghcr.io/${{ github.repository }}/api:${{ env.VERSION }}\`" >> CHANGELOG.md
        echo "- Client: \`ghcr.io/${{ github.repository }}/client:${{ env.VERSION }}\`" >> CHANGELOG.md
    
    - name: Build and tag Docker images
      run: |
        # Build API image
        docker build -t ghcr.io/${{ github.repository }}/api:${{ env.VERSION }} ./api
        docker build -t ghcr.io/${{ github.repository }}/api:latest ./api
        
        # Build Client image
        docker build -t ghcr.io/${{ github.repository }}/client:${{ env.VERSION }} ./client
        docker build -t ghcr.io/${{ github.repository }}/client:latest ./client
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Push Docker images
      run: |
        # Push API images
        docker push ghcr.io/${{ github.repository }}/api:${{ env.VERSION }}
        docker push ghcr.io/${{ github.repository }}/api:latest
        
        # Push Client images
        docker push ghcr.io/${{ github.repository }}/client:${{ env.VERSION }}
        docker push ghcr.io/${{ github.repository }}/client:latest
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.VERSION }}
        name: Release ${{ env.VERSION }}
        body_path: CHANGELOG.md
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          docker-compose.yml
          docker-compose.staging.yml
          PRODUCTION.md
          CI-CD.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Notify release
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: |
          🎉 New release published: ${{ env.VERSION }}
          
          📦 Docker Images:
          - API: ghcr.io/${{ github.repository }}/api:${{ env.VERSION }}
          - Client: ghcr.io/${{ github.repository }}/client:${{ env.VERSION }}
          
          🔗 Release: https://github.com/${{ github.repository }}/releases/tag/${{ env.VERSION }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}