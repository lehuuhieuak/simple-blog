name: Database Backup

on:
  schedule:
    # Daily backup at 3 AM UTC
    - cron: '0 3 * * *'
    # Weekly full backup on Sundays at 4 AM UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to backup'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging
      backup_type:
        description: 'Type of backup'
        required: true
        default: 'incremental'
        type: choice
        options:
        - full
        - incremental

jobs:
  backup-database:
    name: Backup Database
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set backup variables
      run: |
        echo "BACKUP_DATE=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_ENV
        echo "BACKUP_TYPE=${{ github.event.inputs.backup_type || 'incremental' }}" >> $GITHUB_ENV
        echo "ENVIRONMENT=${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_ENV
    
    - name: Create database backup
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        script: |
          cd /opt/blog-app
          
          # Create backup directory if it doesn't exist
          mkdir -p backups
          
          # Determine backup type
          if [ "${{ env.BACKUP_TYPE }}" = "full" ] || [ "$(date +%u)" = "7" ]; then
            BACKUP_TYPE="FULL"
            BACKUP_NAME="blog_full_${{ env.BACKUP_DATE }}.bak"
          else
            BACKUP_TYPE="DIFFERENTIAL"
            BACKUP_NAME="blog_diff_${{ env.BACKUP_DATE }}.bak"
          fi
          
          echo "Creating $BACKUP_TYPE backup: $BACKUP_NAME"
          
          # Create backup
          docker-compose exec -T mssql /opt/mssql-tools/bin/sqlcmd \
            -S localhost -U sa -P "$(cat secrets/db_password.txt)" \
            -Q "BACKUP DATABASE blog TO DISK = '/var/backups/$BACKUP_NAME' WITH $BACKUP_TYPE, COMPRESSION, CHECKSUM"
          
          # Verify backup
          docker-compose exec -T mssql /opt/mssql-tools/bin/sqlcmd \
            -S localhost -U sa -P "$(cat secrets/db_password.txt)" \
            -Q "RESTORE VERIFYONLY FROM DISK = '/var/backups/$BACKUP_NAME'"
          
          echo "Backup completed successfully: $BACKUP_NAME"
    
    - name: Upload backup to cloud storage
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        script: |
          cd /opt/blog-app/backups
          
          # Find the latest backup file
          LATEST_BACKUP=$(ls -t blog_*_${{ env.BACKUP_DATE }}.bak | head -1)
          
          if [ -n "$LATEST_BACKUP" ]; then
            echo "Uploading $LATEST_BACKUP to cloud storage..."
            
            # Upload to AWS S3 (if configured)
            if [ -n "${{ secrets.AWS_S3_BUCKET }}" ]; then
              aws s3 cp "$LATEST_BACKUP" "s3://${{ secrets.AWS_S3_BUCKET }}/database-backups/${{ env.ENVIRONMENT }}/"
            fi
            
            # Upload to Azure Blob Storage (if configured)
            if [ -n "${{ secrets.AZURE_STORAGE_ACCOUNT }}" ]; then
              az storage blob upload \
                --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
                --account-key "${{ secrets.AZURE_STORAGE_KEY }}" \
                --container-name "database-backups" \
                --name "${{ env.ENVIRONMENT }}/$LATEST_BACKUP" \
                --file "$LATEST_BACKUP"
            fi
            
            echo "Backup uploaded successfully"
          else
            echo "No backup file found"
            exit 1
          fi
    
    - name: Cleanup old backups
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.PRODUCTION_HOST }}
        username: ${{ secrets.PRODUCTION_USER }}
        key: ${{ secrets.PRODUCTION_SSH_KEY }}
        script: |
          cd /opt/blog-app/backups
          
          # Keep last 7 daily backups
          find . -name "blog_diff_*.bak" -type f -mtime +7 -delete
          
          # Keep last 4 weekly full backups
          find . -name "blog_full_*.bak" -type f -mtime +28 -delete
          
          echo "Old backups cleaned up"
    
    - name: Notify backup status
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: |
          Database backup ${{ job.status }}!
          Environment: ${{ env.ENVIRONMENT }}
          Type: ${{ env.BACKUP_TYPE }}
          Date: ${{ env.BACKUP_DATE }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  test-backup-restore:
    name: Test Backup Restore
    runs-on: ubuntu-latest
    needs: backup-database
    if: github.event.inputs.backup_type == 'full' || github.event.schedule == '0 4 * * 0'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Test backup restore on staging
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        script: |
          cd /opt/blog-app
          
          # Download latest backup from production
          LATEST_BACKUP=$(ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} "cd /opt/blog-app/backups && ls -t blog_full_*.bak | head -1")
          
          if [ -n "$LATEST_BACKUP" ]; then
            echo "Testing restore of $LATEST_BACKUP"
            
            # Copy backup file from production
            scp ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:/opt/blog-app/backups/$LATEST_BACKUP ./backups/
            
            # Create test database
            docker-compose exec -T mssql /opt/mssql-tools/bin/sqlcmd \
              -S localhost -U sa -P "$(cat secrets/staging_db_password.txt)" \
              -Q "CREATE DATABASE blog_restore_test"
            
            # Restore backup to test database
            docker-compose exec -T mssql /opt/mssql-tools/bin/sqlcmd \
              -S localhost -U sa -P "$(cat secrets/staging_db_password.txt)" \
              -Q "RESTORE DATABASE blog_restore_test FROM DISK = '/var/backups/$LATEST_BACKUP' WITH REPLACE"
            
            # Verify restore
            docker-compose exec -T mssql /opt/mssql-tools/bin/sqlcmd \
              -S localhost -U sa -P "$(cat secrets/staging_db_password.txt)" \
              -Q "USE blog_restore_test; SELECT COUNT(*) as TableCount FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_TYPE = 'BASE TABLE'"
            
            # Cleanup test database
            docker-compose exec -T mssql /opt/mssql-tools/bin/sqlcmd \
              -S localhost -U sa -P "$(cat secrets/staging_db_password.txt)" \
              -Q "DROP DATABASE blog_restore_test"
            
            echo "Backup restore test completed successfully"
          else
            echo "No backup file found for testing"
            exit 1
          fi
    
    - name: Notify restore test status
      uses: 8398a7/action-slack@v3
      if: always()
      with:
        status: ${{ job.status }}
        text: |
          Backup restore test ${{ job.status }}!
          Environment: staging
          Date: $(date)
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}